[server]
# The file watcher walks every imported module, which makes transformers import all of
# its lazy model modules on each rerun. Restart the app to pick up code changes instead.
fileWatcherType = "none"
headless = true
# The screen can approve notes and place holds and has no login: serve it to this machine only.
address = "localhost"

[browser]
gatherUsageStats = false
