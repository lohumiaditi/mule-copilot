services:
  neo4j:
    image: neo4j:2026.09.0-community
    ports:   # this machine only: the default password is in the repo
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mulecopilot}
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
